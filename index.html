    <meta charset="UTF-8" />

    <meta property="og:title" content="FDR GUARD — Financial Security Deposit & FDR Management" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // AI Studio Runtime: HMR is disabled in container. Ignore WebSocket connection events.
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event && event.reason ? String(event.reason.message || event.reason) : '';
        var stack = event && event.reason ? String(event.reason.stack || '') : '';
        if (msg.indexOf('WebSocket') !== -1 || stack.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event ? String(event.message || '') : '';
        var file = event ? String(event.filename || '') : '';
        if (msg.indexOf('WebSocket') !== -1 || file.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
